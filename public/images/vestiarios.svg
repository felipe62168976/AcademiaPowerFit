<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <!-- floor tiles -->
  <rect y="820" width="1600" height="180" fill="#0d0d0d"/>
  <g stroke="#1a1a1a" stroke-width="1">
    <line x1="0" y1="860" x2="1600" y2="860"/>
    <line x1="0" y1="900" x2="1600" y2="900"/>
    <line x1="0" y1="940" x2="1600" y2="940"/>
    <line x1="200" y1="820" x2="200" y2="1000"/>
    <line x1="400" y1="820" x2="400" y2="1000"/>
    <line x1="600" y1="820" x2="600" y2="1000"/>
    <line x1="800" y1="820" x2="800" y2="1000"/>
    <line x1="1000" y1="820" x2="1000" y2="1000"/>
    <line x1="1200" y1="820" x2="1200" y2="1000"/>
    <line x1="1400" y1="820" x2="1400" y2="1000"/>
  </g>
  <!-- lockers row -->
  <g fill="#1e1e1e" stroke="#333" stroke-width="2">
    <rect x="150" y="200" width="110" height="500" rx="4"/>
    <rect x="265" y="200" width="110" height="500" rx="4"/>
    <rect x="380" y="200" width="110" height="500" rx="4"/>
    <rect x="495" y="200" width="110" height="500" rx="4"/>
    <rect x="610" y="200" width="110" height="500" rx="4"/>
  </g>
  <!-- locker details -->
  <g fill="#2a2a2a">
    <circle cx="240" cy="440" r="6"/>
    <circle cx="355" cy="440" r="6"/>
    <circle cx="470" cy="440" r="6"/>
    <circle cx="585" cy="440" r="6"/>
    <circle cx="700" cy="440" r="6"/>
  </g>
  <g stroke="#333" stroke-width="1">
    <line x1="165" y1="220" x2="245" y2="220"/>
    <line x1="165" y1="230" x2="245" y2="230"/>
    <line x1="280" y1="220" x2="360" y2="220"/>
    <line x1="280" y1="230" x2="360" y2="230"/>
    <line x1="395" y1="220" x2="475" y2="220"/>
    <line x1="395" y1="230" x2="475" y2="230"/>
    <line x1="510" y1="220" x2="590" y2="220"/>
    <line x1="510" y1="230" x2="590" y2="230"/>
    <line x1="625" y1="220" x2="705" y2="220"/>
    <line x1="625" y1="230" x2="705" y2="230"/>
  </g>
  <!-- bench -->
  <g fill="#2a2a2a">
    <rect x="150" y="720" width="570" height="22" rx="6"/>
    <rect x="180" y="742" width="16" height="78"/>
    <rect x="680" y="742" width="16" height="78"/>
  </g>
  <!-- mirror -->
  <rect x="820" y="180" width="300" height="500" rx="8" fill="#151525" stroke="#333" stroke-width="4"/>
  <rect x="835" y="195" width="130" height="230" rx="4" fill="#1a1a30" opacity=".6"/>
  <!-- shower area -->
  <g fill="#252525">
    <rect x="1200" y="180" width="320" height="540" rx="8"/>
  </g>
  <g fill="#333">
    <rect x="1220" y="200" width="280" height="6" rx="3"/>
    <rect x="1350" y="200" width="8" height="80"/>
    <circle cx="1354" cy="290" r="20"/>
    <circle cx="1354" cy="290" r="12" fill="#444"/>
  </g>
  <!-- shower head water -->
  <g stroke="#4488aa" stroke-width="1.5" opacity=".4">
    <line x1="1340" y1="310" x2="1335" y2="360"/>
    <line x1="1348" y1="310" x2="1348" y2="370"/>
    <line x1="1356" y1="310" x2="1360" y2="365"/>
    <line x1="1364" y1="310" x2="1370" y2="355"/>
    <line x1="1332" y1="310" x2="1325" y2="350"/>
  </g>
  <!-- red accent line -->
  <rect x="0" y="990" width="1600" height="10" fill="#e10600" opacity=".6"/>
</svg>
