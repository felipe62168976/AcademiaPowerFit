<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1922"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect y="810" width="1600" height="190" fill="#0a0a0a"/>
  <rect y="810" width="1600" height="3" fill="#e10600" opacity=".4"/>
  <!-- treadmill 1 -->
  <g fill="#2a2a2a" stroke="#3a3a3a" stroke-width="2">
    <rect x="200" y="500" width="300" height="18" rx="8" transform="rotate(-8 350 509)"/>
    <rect x="220" y="490" width="12" height="320"/>
    <rect x="470" y="440" width="12" height="360"/>
    <rect x="210" y="420" width="140" height="10" rx="4"/>
    <rect x="210" y="420" width="10" height="90"/>
    <!-- display -->
    <rect x="240" y="370" width="80" height="55" rx="8" fill="#1a1a2e" stroke="#e10600" stroke-width="2"/>
    <text x="280" y="400" text-anchor="middle" font-family="Arial" font-size="16" fill="#e10600">8.5</text>
    <text x="280" y="418" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">km/h</text>
  </g>
  <!-- treadmill 2 -->
  <g fill="#2a2a2a" stroke="#3a3a3a" stroke-width="2">
    <rect x="560" y="500" width="300" height="18" rx="8" transform="rotate(-8 710 509)"/>
    <rect x="580" y="490" width="12" height="320"/>
    <rect x="830" y="440" width="12" height="360"/>
    <rect x="570" y="420" width="140" height="10" rx="4"/>
    <rect x="570" y="420" width="10" height="90"/>
    <rect x="600" y="370" width="80" height="55" rx="8" fill="#1a1a2e" stroke="#e10600" stroke-width="2"/>
    <text x="640" y="400" text-anchor="middle" font-family="Arial" font-size="16" fill="#e10600">12.0</text>
    <text x="640" y="418" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">km/h</text>
  </g>
  <!-- stationary bike -->
  <g fill="#2a2a2a" stroke="#3a3a3a" stroke-width="2">
    <circle cx="1100" cy="720" r="90" fill="none" stroke="#444" stroke-width="8"/>
    <circle cx="1100" cy="720" r="15" fill="#333"/>
    <rect x="1090" y="480" width="16" height="240"/>
    <rect x="1060" y="480" width="80" height="12" rx="4"/>
    <rect x="1070" y="430" width="60" height="55" rx="6"/>
    <rect x="1080" y="380" width="8" height="60"/>
    <rect x="1060" y="375" width="50" height="10" rx="4"/>
  </g>
  <!-- heart rate monitor -->
  <g>
    <rect x="1300" y="350" width="180" height="120" rx="12" fill="#111" stroke="#e10600" stroke-width="2"/>
    <polyline points="1320,410 1350,410 1365,380 1380,440 1395,390 1410,410 1460,410" fill="none" stroke="#e10600" stroke-width="3"/>
    <text x="1390" y="395" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#e10600">142</text>
    <text x="1390" y="455" text-anchor="middle" font-family="Arial" font-size="14" fill="#888">BPM</text>
  </g>
  <!-- rowing machine silhouette -->
  <g fill="#252525" stroke="#333" stroke-width="2" opacity=".6">
    <rect x="1200" y="680" width="280" height="14" rx="6"/>
    <rect x="1220" y="660" width="60" height="24" rx="6"/>
    <rect x="1400" y="620" width="14" height="70"/>
    <rect x="1380" y="610" width="54" height="14" rx="4"/>
  </g>
  <rect x="0" y="990" width="1600" height="10" fill="#e10600" opacity=".6"/>
</svg>
