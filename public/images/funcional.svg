<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <!-- open floor area -->
  <rect y="780" width="1600" height="220" fill="#0d0d0d"/>
  <rect y="780" width="1600" height="3" fill="#e10600" opacity=".5"/>
  <!-- TRX / suspension trainer -->
  <g stroke="#555" stroke-width="4" fill="none">
    <line x1="350" y1="100" x2="320" y2="500"/>
    <line x1="400" y1="100" x2="430" y2="500"/>
  </g>
  <g fill="#e10600">
    <rect x="305" y="495" width="30" height="20" rx="4"/>
    <rect x="415" y="495" width="30" height="20" rx="4"/>
  </g>
  <rect x="280" y="80" width="200" height="14" rx="6" fill="#444"/>
  <!-- kettlebells -->
  <g fill="#2a2a2a" stroke="#e10600" stroke-width="3">
    <circle cx="650" cy="720" r="45"/>
    <path d="M630 685 Q650 655 670 685" fill="none" stroke="#e10600" stroke-width="6"/>
  </g>
  <g fill="#2a2a2a" stroke="#e10600" stroke-width="3">
    <circle cx="760" cy="740" r="35"/>
    <path d="M745 712 Q760 690 775 712" fill="none" stroke="#e10600" stroke-width="5"/>
  </g>
  <!-- battle ropes -->
  <g stroke="#444" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M900 500 Q980 450 1060 520 Q1140 590 1220 510 Q1300 430 1380 500 Q1420 530 1460 500"/>
    <path d="M900 540 Q980 490 1060 560 Q1140 630 1220 550 Q1300 470 1380 540 Q1420 570 1460 540" stroke="#333"/>
  </g>
  <!-- medicine ball -->
  <g>
    <circle cx="500" cy="740" r="40" fill="#222" stroke="#555" stroke-width="3"/>
    <line x1="460" y1="740" x2="540" y2="740" stroke="#e10600" stroke-width="2"/>
    <line x1="500" y1="700" x2="500" y2="780" stroke="#e10600" stroke-width="2"/>
  </g>
  <!-- agility ladder on floor -->
  <g stroke="#e10600" stroke-width="3" opacity=".7">
    <line x1="1000" y1="840" x2="1400" y2="840"/>
    <line x1="1000" y1="900" x2="1400" y2="900"/>
    <line x1="1080" y1="840" x2="1080" y2="900"/>
    <line x1="1160" y1="840" x2="1160" y2="900"/>
    <line x1="1240" y1="840" x2="1240" y2="900"/>
    <line x1="1320" y1="840" x2="1320" y2="900"/>
  </g>
  <!-- pull-up bar -->
  <g fill="#444">
    <rect x="150" y="150" width="14" height="400"/>
    <rect x="550" y="150" width="14" height="400"/>
    <rect x="140" y="140" width="440" height="14" rx="6"/>
  </g>
  <!-- cones -->
  <g fill="#e10600" opacity=".8">
    <polygon points="830,770 845,730 860,770"/>
    <polygon points="880,780 892,748 904,780"/>
  </g>
  <rect x="0" y="990" width="1600" height="10" fill="#e10600" opacity=".6"/>
</svg>
