<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e10600"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <!-- floor -->
  <rect y="820" width="1600" height="180" fill="#111"/>
  <rect y="820" width="1600" height="4" fill="#e10600" opacity=".6"/>
  <!-- dumbbell silhouette left -->
  <g fill="#2a2a2a" opacity=".7">
    <rect x="120" y="580" width="180" height="24" rx="8"/>
    <rect x="80" y="530" width="50" height="124" rx="10"/>
    <rect x="290" y="530" width="50" height="124" rx="10"/>
    <rect x="40" y="555" width="50" height="74" rx="8"/>
    <rect x="330" y="555" width="50" height="74" rx="8"/>
  </g>
  <!-- person silhouette center -->
  <g fill="#e10600" opacity=".9">
    <circle cx="800" cy="280" r="50"/>
    <rect x="770" y="330" width="60" height="180" rx="12"/>
    <rect x="730" y="370" width="50" height="130" rx="10" transform="rotate(-20 755 435)"/>
    <rect x="820" y="370" width="50" height="130" rx="10" transform="rotate(20 845 435)"/>
    <rect x="765" y="510" width="30" height="170" rx="8"/>
    <rect x="805" y="510" width="30" height="170" rx="8"/>
  </g>
  <!-- barbell overhead -->
  <g fill="#555">
    <rect x="680" y="340" width="240" height="18" rx="6"/>
    <rect x="650" y="310" width="40" height="78" rx="8"/>
    <rect x="910" y="310" width="40" height="78" rx="8"/>
    <rect x="630" y="325" width="30" height="48" rx="6"/>
    <rect x="940" y="325" width="30" height="48" rx="6"/>
  </g>
  <!-- accent lines -->
  <line x1="0" y1="200" x2="400" y2="200" stroke="#e10600" stroke-width="2" opacity=".3"/>
  <line x1="1200" y1="200" x2="1600" y2="200" stroke="#e10600" stroke-width="2" opacity=".3"/>
  <line x1="0" y1="210" x2="300" y2="210" stroke="#fff" stroke-width="1" opacity=".1"/>
  <line x1="1300" y1="210" x2="1600" y2="210" stroke="#fff" stroke-width="1" opacity=".1"/>
  <!-- POWER FIT text -->
  <text x="800" y="760" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="120" font-weight="900" fill="#fff" letter-spacing="20">POWER</text>
  <text x="800" y="870" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="80" font-weight="900" fill="#e10600" letter-spacing="30">FIT</text>
</svg>
