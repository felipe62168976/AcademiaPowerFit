<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect y="820" width="1600" height="180" fill="#0d0d0d"/>
  <rect y="820" width="1600" height="3" fill="#e10600" opacity=".5"/>
  <!-- instructor figure -->
  <g fill="#e10600">
    <circle cx="550" cy="280" r="45"/>
    <rect x="520" y="330" width="60" height="170" rx="12"/>
    <rect x="480" y="370" width="50" height="120" rx="10" transform="rotate(-25 505 430)"/>
    <rect x="575" y="370" width="50" height="120" rx="10" transform="rotate(25 600 430)"/>
    <rect x="515" y="500" width="30" height="170" rx="8"/>
    <rect x="555" y="500" width="30" height="170" rx="8"/>
  </g>
  <!-- clipboard in instructor hand -->
  <g transform="rotate(-25 640 520)">
    <rect x="610" y="470" width="70" height="90" rx="6" fill="#222" stroke="#555" stroke-width="2"/>
    <rect x="620" y="460" width="50" height="16" rx="4" fill="#555"/>
    <line x1="625" y1="500" x2="665" y2="500" stroke="#888" stroke-width="2"/>
    <line x1="625" y1="515" x2="665" y2="515" stroke="#888" stroke-width="2"/>
    <line x1="625" y1="530" x2="655" y2="530" stroke="#e10600" stroke-width="2"/>
  </g>
  <!-- student figure -->
  <g fill="#555">
    <circle cx="900" cy="300" r="42"/>
    <rect x="872" y="348" width="56" height="160" rx="12"/>
    <rect x="835" y="385" width="46" height="115" rx="10" transform="rotate(-15 858 442)"/>
    <rect x="920" y="385" width="46" height="115" rx="10" transform="rotate(15 943 442)"/>
    <rect x="868" y="508" width="28" height="165" rx="8"/>
    <rect x="904" y="508" width="28" height="165" rx="8"/>
  </g>
  <!-- dumbbell in student hand -->
  <g fill="#666">
    <rect x="810" y="480" width="80" height="12" rx="4"/>
    <rect x="795" y="462" width="24" height="48" rx="6"/>
    <rect x="881" y="462" width="24" height="48" rx="6"/>
  </g>
  <!-- speech bubble / guidance -->
  <g>
    <rect x="350" y="100" width="300" height="100" rx="16" fill="#1a1a2e" stroke="#e10600" stroke-width="2"/>
    <polygon points="480,200 510,200 470,240" fill="#1a1a2e" stroke="#e10600" stroke-width="2"/>
    <line x1="380" y1="135" x2="620" y2="135" stroke="#e10600" stroke-width="3"/>
    <line x1="380" y1="155" x2="580" y2="155" stroke="#666" stroke-width="2"/>
    <line x1="380" y1="175" x2="540" y2="175" stroke="#666" stroke-width="2"/>
  </g>
  <!-- heart rate line accent -->
  <polyline points="1100,400 1150,400 1170,350 1190,450 1210,370 1230,400 1300,400 1320,380 1340,420 1360,400 1500,400" fill="none" stroke="#e10600" stroke-width="3" opacity=".5"/>
  <!-- red accent -->
  <rect x="0" y="990" width="1600" height="10" fill="#e10600" opacity=".6"/>
</svg>
