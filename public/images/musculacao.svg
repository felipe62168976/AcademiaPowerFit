<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <!-- floor -->
  <rect y="800" width="1600" height="200" fill="#0d0d0d"/>
  <rect y="800" width="1600" height="3" fill="#e10600" opacity=".5"/>
  <!-- squat rack -->
  <g fill="#333" stroke="#444" stroke-width="2">
    <rect x="300" y="200" width="30" height="600"/>
    <rect x="560" y="200" width="30" height="600"/>
    <rect x="280" y="200" width="330" height="16" rx="4"/>
    <rect x="280" y="400" width="330" height="12" rx="4"/>
    <rect x="280" y="600" width="330" height="12" rx="4"/>
  </g>
  <!-- barbell on rack -->
  <g fill="#666">
    <rect x="220" y="395" width="450" height="20" rx="6"/>
    <rect x="180" y="365" width="55" height="80" rx="10"/>
    <rect x="655" y="365" width="55" height="80" rx="10"/>
    <rect x="155" y="380" width="40" height="50" rx="8"/>
    <rect x="700" y="380" width="40" height="50" rx="8"/>
  </g>
  <!-- weight plates on floor -->
  <g fill="#2a2a2a" stroke="#e10600" stroke-width="3">
    <circle cx="900" cy="750" r="70"/>
    <circle cx="900" cy="750" r="30" fill="#111"/>
    <circle cx="1050" cy="770" r="60"/>
    <circle cx="1050" cy="770" r="25" fill="#111"/>
  </g>
  <!-- dumbbell rack right -->
  <g fill="#3a3a3a">
    <rect x="1200" y="500" width="300" height="16" rx="4"/>
    <rect x="1200" y="600" width="300" height="16" rx="4"/>
    <!-- top row dumbbells -->
    <rect x="1220" y="460" width="20" height="56" rx="6"/>
    <rect x="1210" y="472" width="40" height="32" rx="5"/>
    <rect x="1300" y="460" width="20" height="56" rx="6"/>
    <rect x="1290" y="472" width="40" height="32" rx="5"/>
    <rect x="1380" y="460" width="20" height="56" rx="6"/>
    <rect x="1370" y="472" width="40" height="32" rx="5"/>
    <rect x="1460" y="460" width="20" height="56" rx="6"/>
    <rect x="1450" y="472" width="40" height="32" rx="5"/>
    <!-- bottom row -->
    <rect x="1220" y="560" width="24" height="64" rx="6"/>
    <rect x="1210" y="574" width="44" height="36" rx="5"/>
    <rect x="1300" y="560" width="24" height="64" rx="6"/>
    <rect x="1290" y="574" width="44" height="36" rx="5"/>
    <rect x="1380" y="560" width="24" height="64" rx="6"/>
    <rect x="1370" y="574" width="44" height="36" rx="5"/>
    <rect x="1460" y="560" width="24" height="64" rx="6"/>
    <rect x="1450" y="574" width="44" height="36" rx="5"/>
  </g>
  <!-- bench -->
  <g fill="#2a2a2a">
    <rect x="750" y="700" width="250" height="20" rx="6"/>
    <rect x="780" y="720" width="16" height="80"/>
    <rect x="950" y="720" width="16" height="80"/>
    <rect x="750" y="680" width="80" height="14" rx="4"/>
  </g>
  <!-- red accent glow -->
  <rect x="0" y="990" width="1600" height="10" fill="#e10600" opacity=".7"/>
</svg>
